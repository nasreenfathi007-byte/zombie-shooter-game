<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Spending Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <h1>Welcome!</h1>
        <div id="login-form">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p>Don't have an account? <a href="#" onclick="toggleAuth()">Register</a></p>
        </div>
        <div id="register-form" style="display: none;">
            <h2>Register</h2>
            <input type="text" id="register-username" placeholder="Username">
            <input type="password" id="register-password" placeholder="Password">
            <button onclick="register()">Register</button>
            <p>Already have an account? <a href="#" onclick="toggleAuth()">Login</a></p>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <header>
            <h1>Monthly Spending Tracker</h1>
            <div>
                <span id="user-display"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </header>

        <main>
            <section id="add-expense">
                <h2>Add Expense</h2>
                <form id="expense-form">
                    <input type="number" id="amount" placeholder="Amount" step="0.01" required>
                    <input type="text" id="description" placeholder="Description" required>
                    <select id="category">
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="date" id="date" required>
                    <button type="submit">Add</button>
                </form>
            </section>

            <section id="expense-list">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Expenses</h2>
                    <div>
                        <label for="month-filter">Month:</label>
                        <input type="month" id="month-filter" onchange="fetchExpenses()">
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-body"></tbody>
                </table>
                <div id="total-container">
                    <strong>Total: $<span id="total-amount">0.00</span></strong>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
