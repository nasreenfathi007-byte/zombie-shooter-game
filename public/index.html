<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>OweTrack</h1>
            <p class="subtitle">Minimalist debt tracker</p>
        </header>

        <!-- Auth Section -->
        <div id="auth-section" class="card">
            <div class="tabs">
                <button id="show-login" class="active">Login</button>
                <button id="show-register">Register</button>
            </div>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <form id="register-form" class="hidden">
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
            <p id="auth-error" class="error"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div class="user-header">
                <span id="user-display"></span>
                <button id="logout-btn" class="text-btn">Logout</button>
            </div>

            <div class="card">
                <h3>Add New Entry</h3>
                <form id="debt-form">
                    <input type="text" id="debtor-name" placeholder="Who owes you?" required>
                    <input type="number" id="debt-amount" placeholder="Amount" step="0.01" required>
                    <input type="text" id="debt-description" placeholder="Description (optional)">
                    <button type="submit">Add Debt</button>
                </form>
            </div>

            <div id="debts-container">
                <h3>Current Debts</h3>
                <div id="debts-list">
                    <!-- Debts will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
