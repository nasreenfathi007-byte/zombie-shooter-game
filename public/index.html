<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="auth-container">
        <h1>Tasks Tracker</h1>
        <div id="login-form">
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button class="primary" onclick="login()">Sign in</button>
            <p style="margin-top: 24px; font-size: 0.875rem;">
                No account? <a href="#" onclick="toggleAuth()" style="color: var(--primary-color); text-decoration: none;">Create one</a>
            </p>
        </div>
        <div id="register-form" style="display: none;">
            <input type="text" id="register-username" placeholder="New Username">
            <input type="password" id="register-password" placeholder="New Password">
            <button class="primary" onclick="register()">Create account</button>
            <p style="margin-top: 24px; font-size: 0.875rem;">
                Have an account? <a href="#" onclick="toggleAuth()" style="color: var(--primary-color); text-decoration: none;">Sign in</a>
            </p>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <header>
            <h1>My Expenses</h1>
            <div class="user-info">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    <svg id="theme-icon" style="width:24px;height:24px" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
                    </svg>
                </button>
                <span id="user-display"></span>
                <span class="logout-link" onclick="logout()">Logout</span>
            </div>
        </header>

        <div class="filter-bar">
            <label for="month-filter">Current view</label>
            <input type="month" id="month-filter" onchange="fetchExpenses()">
        </div>

        <main id="expenses-list">
            <!-- Expenses will be injected here -->
        </main>

        <div id="total-footer">
            <span class="total-label">Monthly Total</span>
            <span id="total-amount">$0.00</span>
        </div>

        <div class="fab" onclick="openModal()">
            <svg viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div id="expense-modal" class="modal">
        <div class="modal-content">
            <h2>Add expense</h2>
            <form id="expense-form">
                <input type="text" id="description" placeholder="What did you spend on?" required>
                <input type="number" id="amount" placeholder="Amount" step="0.01" required>
                <select id="category">
                    <option value="General">General</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Home">Home</option>
                    <option value="Fun">Fun</option>
                </select>
                <input type="date" id="date" required>
                <div class="modal-actions">
                    <button type="button" class="btn-text" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-text" style="font-weight: 700;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
